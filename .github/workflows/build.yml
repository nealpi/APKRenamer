name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    # 关键：所有 run 步骤默认在 APKRenamer/ 子目录里执行
    defaults:
      run:
        working-directory: APKRenamer

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Show repo structure
        run: |
          echo "=== pwd ==="
          pwd
          echo "=== ls here ==="
          ls -la
          echo "=== app ==="
          ls -la app/ || echo "NO app/"
          echo "=== java tree ==="
          find app/src/main/java -type f || echo "NO java sources"

      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.9 --distribution-type bin

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        if: success()
        run: |
          APK=$(find app/build/outputs/apk/debug -name "*.apk" | head -1)
          cp "$APK" APKRenamer.apk

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: APKRenamer
          # upload-artifact 的 path 是从仓库根目录算的，所以要带上 APKRenamer/ 前缀
          path: APKRenamer/APKRenamer.apk
          if-no-files-found: error
