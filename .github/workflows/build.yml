name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Show repo structure
        run: |
          echo "=== root ==="
          ls -la
          echo "=== app ==="
          ls -la app/ || echo "NO app/"
          echo "=== app/src/main ==="
          ls -la app/src/main/ || echo "NO app/src/main/"
          echo "=== java tree ==="
          find app/src/main/java -type f || echo "NO java sources"
          echo "=== res tree ==="
          find app/src/main/res -type f || echo "NO res"

      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.9 --distribution-type bin

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        if: success()
        run: |
          APK=$(find app/build/outputs/apk/debug -name "*.apk" | head -1)
          cp "$APK" APKRenamer.apk

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: APKRenamer
          path: APKRenamer.apk
          if-no-files-found: error
