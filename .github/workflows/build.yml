name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: APKRenamer

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 关键：装一个我们想要的版本的 Gradle，不再生成 wrapper
      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Show repo structure
        run: |
          pwd
          ls -la
          echo "--- app/ ---"
          ls -la app/ || echo "NO app/"

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        if: success()
        run: |
          APK=$(find app/build/outputs/apk/debug -name "*.apk" | head -1)
          cp "$APK" APKRenamer.apk

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: APKRenamer
          path: APKRenamer/APKRenamer.apk
          if-no-files-found: error
