name: Build APK

on:
  # 允许手动触发 —— 不需要 push，在网页上点一下就行
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.9 --distribution-type bin

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace 2>&1 | tail -50

      - name: Rename APK for easy download
        run: |
          APK=$(find app/build/outputs/apk/debug -name "*.apk" | head -1)
          cp "$APK" APKRenamer.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: APKRenamer
          path: APKRenamer.apk
          if-no-files-found: error
